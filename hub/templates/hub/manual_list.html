{% extends 'hub/base.html' %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Manuals & Downloads</h1>
    <div class="list-group">
        {% for manual in manuals %}
        <a href="{{ manual.file.url }}"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            target="_blank">
            <div>
                <h5 class="mb-1">{{ manual.title }}</h5>
                <small class="text-muted">For {{ manual.vfd_model.series_name }}</small>
            </div>
            <span class="badge bg-success rounded-pill">Download PDF</span>
        </a>
        {% empty %}
        <div class="alert alert-info">No manuals available at the moment.</div>
        {% endfor %}
    </div>
    <div class="mt-4">
        <a href="{% url 'index' %}" class="btn btn-secondary">&larr; Back to Home</a>
    </div>
</div>
{% endblock %}
