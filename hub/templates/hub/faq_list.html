{% extends 'hub/base.html' %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Frequently Asked Questions</h1>
    <div class="accordion" id="faqAccordion">
        {% for faq in faqs %}
        <div class="accordion-item">
            <h2 class="accordion-header" id="heading{{ forloop.counter }}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapse{{ forloop.counter }}" aria-expanded="false"
                    aria-controls="collapse{{ forloop.counter }}">
                    {{ faq.question }}
                    {% if faq.related_vfd %}
                    <span class="badge bg-info ms-2">{{ faq.related_vfd.series_name }}</span>
                    {% endif %}
                </button>
            </h2>
            <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse"
                aria-labelledby="heading{{ forloop.counter }}" data-bs-parent="#faqAccordion">
                <div class="accordion-body">
                    {{ faq.answer|linebreaks }}
                    {% if faq.tags %}
                    <div class="mt-2">
                        <small class="text-muted">Tags: {{ faq.tags }}</small>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
        {% empty %}
        <div class="alert alert-info">No FAQs available at the moment.</div>
        {% endfor %}
    </div>
    <div class="mt-4">
        <a href="{% url 'index' %}" class="btn btn-secondary">&larr; Back to Home</a>
    </div>
</div>
{% endblock %}
