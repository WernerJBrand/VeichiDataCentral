{% extends 'hub/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Ask a Question</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required
                                placeholder="e.g. How do I wire the float switch?">
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">Details</label>
                            <textarea class="form-control" id="content" name="content" rows="5" required
                                placeholder="Provide as much detail as possible about your issue..."></textarea>
                        </div>

                        <!-- Optional: VFD Selection would go here if we implemented it in the view fully -->

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Post Question</button>
                            <a href="{% url 'question_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
